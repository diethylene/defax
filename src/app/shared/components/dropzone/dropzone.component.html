<div [class]="containerClasses()">
  <div [class]="iconBoxClasses()">
    <ng-icon name="lucideUpload" size="20" />
  </div>

  <div class="flex flex-col items-center gap-1">
    <p class="text-lg font-medium tracking-tight text-foreground">
      {{ heading() }}
    </p>
    <p class="max-w-md text-sm text-muted-foreground">{{ subtitle() }}</p>
  </div>

  @if (showButton()) {
    <button type="button" hlmBtn tabindex="-1">
      {{ buttonLabel() }}
    </button>
  }
</div>

@if (error(); as rejections) {
  <ul
    class="mt-3 flex flex-col gap-1 text-xs text-destructive"
    aria-live="polite"
  >
    @for (rejection of rejections; track rejection.file) {
      <li>{{ rejection.file.name }} - {{ rejection.reasons.join(', ') }}</li>
    }
  </ul>
}
