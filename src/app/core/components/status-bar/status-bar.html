<footer
  class="flex items-center gap-3 border-t border-border bg-background px-4 py-2.5 sm:px-6"
>
  <app-status-pill [status]="status()" class="order-1" />

  <p
    class="order-2 hidden min-w-0 truncate text-xs text-muted-foreground sm:block"
  >
    {{ description() }}
  </p>

  <span
    class="order-3 ml-auto flex items-center gap-1 text-xs text-muted-foreground sm:order-4"
  >
    <ng-icon name="lucideLock" size="14px" />
    <span class="hidden sm:inline">
      End-to-end encrypted. Files are never stored on a server.
    </span>
    <span class="sm:hidden">Encrypted</span>
  </span>

  <a
    routerLink="/relay-help"
    class="order-4 flex size-6 items-center justify-center rounded-sm text-muted-foreground outline-none hover:bg-muted focus-visible:ring-2 focus-visible:ring-ring/50 sm:order-3"
    aria-label="Relay help"
  >
    <ng-icon name="lucideHelpCircle" size="16px" />
  </a>
</footer>
