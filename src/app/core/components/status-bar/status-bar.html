<footer
  class="flex items-center justify-between gap-3 border-t border-border bg-background px-4 py-2.5 sm:px-6"
>
  <div class="flex min-w-0 items-center gap-3">
    <app-status-pill [status]="status()" [label]="label()" />
    @if (description()) {
      <p class="hidden min-w-0 truncate text-xs text-muted-foreground sm:block">
        {{ description() }}
      </p>
    }
  </div>

  <div class="flex shrink-0 items-center gap-3">
    <span
      class="flex items-center gap-1 text-xs text-muted-foreground sm:order-2"
    >
      <ng-icon name="lucideLock" size="14px" />
      <span class="hidden sm:inline">
        End-to-end encrypted. Files are never stored on a server.
      </span>
      <span class="sm:hidden">Encrypted</span>
    </span>
    <a
      routerLink="/relay-help"
      class="flex size-6 items-center justify-center rounded-sm text-muted-foreground outline-none hover:bg-muted focus-visible:ring-2 focus-visible:ring-ring/50 sm:order-1"
      aria-label="Relay help"
    >
      <ng-icon name="lucideHelpCircle" size="16px" />
    </a>
  </div>
</footer>
