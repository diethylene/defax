<section
  class="mx-auto flex w-full max-w-2xl flex-col items-center gap-10 px-4 py-12 sm:px-6 sm:py-16"
>
  <header class="flex flex-col items-center gap-2 text-center">
    <h1 class="text-3xl font-semibold tracking-tight text-foreground">
      {{ heading() }}
    </h1>
    <p class="max-w-md text-balance text-muted-foreground">
      {{ subheading() }}
    </p>
  </header>

  <ng-content />

  @if (steps().length > 0) {
    <ol class="grid w-full list-none gap-6 sm:grid-cols-3">
      @for (step of steps(); track $index) {
        <li class="flex items-start gap-3">
          <span
            hlmBadge
            variant="outline"
            class="size-6 justify-center rounded-full p-0 text-muted-foreground"
          >
            {{ $index + 1 }}
          </span>
          <p class="text-sm text-muted-foreground">
            <strong class="font-medium text-foreground">{{ step.title }}</strong>
            {{ step.description }}
          </p>
        </li>
      }
    </ol>
  }
</section>
