<section hlmCard class="w-full">
  <div hlmCardContent class="flex flex-col gap-3">
    <form class="flex flex-col gap-2" (submit)="submit($event)">
      <label hlmLabel for="receive-code">Code from the sender</label>

      <div class="flex items-center gap-2">
        <div class="relative flex-1">
          <input
            hlmInput
            [formControl]="code"
            id="receive-code"
            class="h-11 pr-9"
            [forceInvalid]="submitted() && code.invalid"
            [class.border-success]="code.valid && code.value.trim().length > 0"
            placeholder="123456-apple-orca"
            autocomplete="off"
            autocapitalize="none"
            spellcheck="false"
          />
          @if (code.valid && code.value.trim().length > 0) {
            <ng-icon
              name="lucideCheck"
              size="18"
              class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-success"
            />
          }
        </div>

        <button
          type="submit"
          hlmBtn
          size="lg"
          class="h-11"
          [disabled]="connecting() || code.value.trim().length === 0"
        >
          Connect
        </button>
      </div>

      @if (submitted() && code.invalid) {
        <p class="text-sm text-destructive" aria-live="polite">
          That code doesn't look right. Check it and try again.
        </p>
      }
    </form>

    @if (connecting()) {
      <div @grow class="flex flex-col gap-4 overflow-hidden">
        <hlm-separator />
        <app-spinner
          heading="Connecting securely to the sender..."
          subheading="Both devices prove they have the same code. The code itself is never sent."
        />
      </div>
    }
  </div>
</section>
