<app-page-shell
  heading="Sending"
  subheading="Keep this tab open until the transfer finishes."
>
  <app-transfer-progress mode="send" [progress]="progress" />

  <div class="flex w-full justify-end">
    <button
      type="button"
      hlmBtn
      variant="outline"
      size="lg"
      (click)="cancel()"
    >
      Cancel transfer
    </button>
  </div>
</app-page-shell>
