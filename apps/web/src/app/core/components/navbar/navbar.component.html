<header class="flex items-center justify-between gap-4 px-4 py-3">
  <app-nav
    [items]="primaryItems"
    [activeRoute]="activeRoute()"
    ariaLabel="Primary"
  >
    <a
      nav-leading
      routerLink="/"
      href="/"
      class="mr-4 inline-flex items-center gap-2 rounded-sm pl-1.5 outline-none focus-visible:ring-2 focus-visible:ring-ring/50"
      aria-label="Defax home"
    >
      <span
        class="inline-flex size-4 items-center justify-center rounded-sm bg-foreground text-background"
      >
        <ng-icon name="lucideArrowLeftRight" size="10px" />
      </span>
      <span class="hidden text-sm font-semibold sm:inline">defax</span>
    </a>
    <span
      nav-leading
      class="mr-2 hidden h-5 w-px bg-border sm:block"
      aria-hidden="true"
    ></span>
  </app-nav>

  <app-nav
    [items]="secondaryItems"
    [activeRoute]="activeRoute()"
    ariaLabel="Secondary"
  >
    <span
      nav-trailing
      class="ml-2 mr-1 hidden h-5 w-px bg-border sm:block"
      aria-hidden="true"
    ></span>
    <app-theme-toggle nav-trailing />
  </app-nav>
</header>
