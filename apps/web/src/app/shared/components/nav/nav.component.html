<nav [attr.aria-label]="ariaLabel()" [class]="containerClasses" data-slot="nav">
  <ng-content select="[nav-leading]" />
  @for (item of view(); track item.route) {
    <!-- biome-ignore lint/a11y/useValidAnchor: routerLink renders the href at runtime -->
    <a
      [routerLink]="item.route"
      [class]="item.classes"
      [attr.aria-current]="item.active ? 'page' : null"
    >
      @if (item.icon) {
        <ng-icon [name]="item.icon" size="16px" />
      }
      <span [class.hidden]="item.hideLabelOnMobile" class="sm:inline">{{
        item.label
      }}</span>
    </a>
  }
  <ng-content select="[nav-trailing]" />
</nav>
