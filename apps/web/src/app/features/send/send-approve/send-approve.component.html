<app-page-shell
  heading="Receiver connected"
  subheading="They are checking the details before accepting. Nothing has been sent yet."
>
  <section hlmCard class="w-full">
    <div hlmCardContent class="flex flex-col items-center gap-4 text-center">
      <div class="flex flex-col gap-1">
        <h2 class="text-lg font-semibold tracking-tight text-foreground">
          Verification number
        </h2>
        <p class="text-sm text-muted-foreground">
          The receiver sees the same number. If they read you a different one,
          cancel.
        </p>
      </div>

      @let sasValue = sas();
      @if (sasValue) {
        <app-sas-number [sas]="sasValue" />
      }
    </div>
  </section>

  <section hlmCard class="w-full">
    <div hlmCardContent>
      <app-fingerprint-card
        [identity]="peerIdentity()"
        [file]="fileSummary()"
        [checksum]="digest()"
      />
    </div>
  </section>

  <div
    class="flex w-full flex-col gap-4 sm:flex-row sm:items-center sm:justify-between"
  >
    <div class="flex items-center gap-3">
      <hlm-spinner class="text-xl" />
      <p class="text-sm font-medium text-foreground">
        Waiting for the receiver to accept...
      </p>
    </div>

    <button
      type="button"
      hlmBtn
      variant="outline"
      size="lg"
      class="w-full sm:w-auto"
      (click)="cancel()"
    >
      Cancel
    </button>
  </div>
</app-page-shell>
