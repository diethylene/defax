<section
  class="mx-auto flex w-full max-w-2xl flex-col items-center gap-10 px-4 py-12 sm:px-6 sm:py-16"
>
  <header class="flex flex-col items-center gap-2 text-center">
    <h1 class="text-3xl font-semibold tracking-tight text-foreground">
      Share this code
    </h1>
    <p class="max-w-md text-balance text-muted-foreground">
      The receiver enters it on the Receive page. It works for one connection
      only.
    </p>
  </header>

  <section hlmCard class="w-full">
    <div hlmCardContent class="flex flex-col gap-4">
      <app-send-code-field [code]="passcode()" />

      <hlm-separator />

      <app-spinner
        heading="Waiting for the receiver to connect..."
        subheading="Keep this tab open. Closing it cancels the transfer."
      />
    </div>
  </section>

  <section hlmCard class="w-full">
    <div hlmCardContent class="flex flex-col gap-4">
      @let file = metadata();
      @if (file) {
        <div class="flex items-center gap-3">
          <span
            class="flex size-10 shrink-0 items-center justify-center rounded-[10px] bg-muted text-foreground"
          >
            <ng-icon name="lucideFile" size="20" />
          </span>
          <div class="flex min-w-0 flex-col gap-0.5">
            <span class="truncate text-sm font-medium text-foreground">{{
              file.name
            }}</span>
            <span class="flex items-center gap-1.5 text-sm text-muted-foreground">
              <span>{{ file.size | fileSize }}</span>
              <span aria-hidden="true">·</span>
              <span>{{ file.extension | fileType }}</span>
              <span aria-hidden="true">·</span>
              <span>{{ file.lastModified | date: 'mediumDate' }}</span>
            </span>
          </div>
        </div>
      } @else {
        <div class="flex items-center gap-3">
          <hlm-skeleton class="size-10 shrink-0 rounded-[10px]" />
          <div class="flex flex-col gap-2">
            <hlm-skeleton class="h-4 w-40" />
            <hlm-skeleton class="h-4 w-64" />
          </div>
        </div>
      }

      <hlm-separator />

      <app-sha-checksum [checksum]="digest()" />
    </div>
  </section>

  <button
    type="button"
    hlmBtn
    variant="outline"
    size="lg"
    class="self-end"
    (click)="cancel()"
  >
    Cancel
  </button>
</section>
